name: mbrics
description: A cross-border digital trade and payment platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.2.0
  supabase_flutter: ^2.0.0
  go_router: ^14.0.1
  image_picker: ^1.0.7
  file_picker: ^10.3.8
  image: ^4.2.0
  # Note: Keeping google_fonts in dependencies for now to avoid breakages, 
  # but our code will now bypass it to use local assets.
  google_fonts: ^6.2.1
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf
        - asset: assets/fonts/Inter_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_24pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_24pt-Italic.ttf
          style: italic

    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf

  assets:
    - assets/mbrics_logo.png
    - assets/google_logo.png
    - assets/default_avatar.png
    - assets/icons/
    - assets/fonts/
    - assets/escrow_explain.png
    - assets/ddp_explain.png