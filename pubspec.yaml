name: mbrics
description: A cross-border digital trade and payment platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  http: ^1.2.0
  supabase_flutter: ^2.0.0
  go_router: ^14.0.1
  image_picker: ^1.0.7
  file_picker: ^10.3.8
  image: ^4.2.0
  # google_fonts REMOVED to prevent CDN blocking issues in China
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/mbrics_logo.png
    - assets/google_logo.png
    - assets/default_avatar.png
    - assets/escrow_explain.png
    - assets/ddP.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf
        - asset: assets/fonts/Inter_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_24pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_24pt-Italic.ttf
          style: italic

    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf